name: Feature request
description: Suggest a new capability or an improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. For open-ended brainstorming, [Discord](https://discord.gg/cz6GQHQUMg) is a good place to start. UI changes and new core features need agreement in an issue before anyone writes code; see [what gets merged](https://github.com/lthoangg/OpenAgentd/blob/main/CONTRIBUTING.md#what-gets-merged).

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you submit
      options:
        - label: I searched [existing issues](https://github.com/lthoangg/OpenAgentd/issues?q=is%3Aissue) for a duplicate or a related roadmap item.
          required: true
        - label: I checked the [feature catalogue](https://github.com/lthoangg/OpenAgentd/blob/main/documents/docs/features.md), and this isn't already shipped.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What are you trying to do, and what gets in the way today? Who else runs into this?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work from the user's point of view?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, workarounds you use today, or doing nothing.

  - type: textarea
    id: scope
    attributes:
      label: Scope and trade-offs
      description: What is the smallest useful version? What should stay out of scope? Any risks?

  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to work on this?
      options:
        - Yes, I'd like to open a pull request
        - I can help test or review
        - No

  - type: input
    id: affiliation
    attributes:
      label: Affiliation
      description: If you work for, or are paid by, a product or service this request would integrate (for example, a model provider), say so here.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, mockups, links, or how other tools handle this.
